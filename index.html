<div id="sfs-admin-portal" style="display:none; position:fixed; inset:0; z-index:99999; background:#FFF8F0; overflow-y:auto; font-family:Inter,sans-serif;">

      <div>

          <img id="admin-photo-preview-img" style="display:none; margin-top:8px; width:100%; height:200px; object-fit:cover; border-radius:12px;">
          <textarea id="admin-caption" placeholder="Caption & details" rows="3" style="width:100%; border:1px solid rgba(0,0,0,0.1); border-radius:16px; padding:12px 16px; font-size:13px;" oninput="updatePreview()"></textarea>
          <select id="admin-category" style="width:100%; border:1px solid rgba(0,0,0,0.1); border-radius:9999px; padding:12px 16px; font-size:13px; background:white;" onchange="updatePreview()">
            <option value="tops">Tops</option><option value="bottoms">Bottoms</option><option value="outerwear">Outerwear</option><option value="dresses" selected>Dresses</option><option value="sport">Sport</option><option value="workwear">Workwear</option>
          </select>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px;">
            <label style="display:flex; gap:8px; background:#FFF8F0; border-radius:12px; padding:10px;"><input type="checkbox" id="size-S" onchange="updatePreview()"> S</label>
            <label style="display:flex; gap:8px; background:#FFF8F0; border-radius:12px; padding:10px;"><input type="checkbox" id="size-M" onchange="updatePreview()"> M</label>
            <label style="display:flex; gap:8px; background:#FFF8F0; border-radius:12px; padding:10px;"><input type="checkbox" id="size-L" onchange="updatePreview()"> L</label>
            <label style="display:flex; gap:8px; background:#FFF8F0; border-radius:12px; padding:10px;"><input type="checkbox" id="size-XL" onchange="updatePreview()"> XL</label>
          </div>
          <button onclick="alert('Preview works!')" style="margin-top:12px; width:100%; background:#2E5A3E; color:white; border-radius:9999px; padding:14px; border:none; cursor:pointer;">Save</button>
        </div>
      </div>
      <div style="position:sticky; top:24px;">
        <div style="font-size:10px; text-transform:uppercase; letter-spacing:0.14em; opacity:0.6; margin-bottom:12px;">Live Preview</div>
        <div id="admin-live-preview" style="background:white; border:1px solid rgba(0,0,0,0.05); border-radius:20px; overflow:hidden;">
          <div style="position:relative;">
            <div id="preview-img" style="width:100%; height:260px; background:#FFF8F0; display:flex; align-items:center; justify-content:center; font-size:12px; opacity:0.5;">No photo</div>
            <div style="position:absolute; top:12px; left:12px; background:rgba(255,255,255,0.9); border-radius:9999px; padding:4px 10px; font-size:10px;">Piece 01</div>
          </div>
          <div style="padding:16px;">
            <div id="preview-title" style="font-family:Fraunces, serif; font-size:16px; font-weight:600;">Product name</div>
            <div id="preview-caption" style="margin-top:8px; font-size:12px; opacity:0.7;">Caption...</div>
            <div id="preview-sizes" style="margin-top:12px; display:flex; gap:6px; flex-wrap:wrap;"></div>
            <div style="margin-top:16px; background:#2E5A3E; color:white; border-radius:9999px; padding:10px; text-align:center; font-size:12px;">Order Now</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="admin-password-modal" style="display:none; position:fixed; inset:0; z-index:100000; background:rgba(0,0,0,0.5); backdrop-filter:blur(8px); align-items:center; justify-content:center;">
  <div style="background:white; border-radius:20px; padding:28px; width:90%; max-width:360px;">
    <div style="font-family:Fraunces, serif; font-size:18px; font-weight:600;">Admin Portal</div>
    <input id="admin-pwd-input" type="password" placeholder="Password" style="width:100%; margin-top:16px; border:1px solid rgba(0,0,0,0.1); border-radius:9999px; padding:12px 16px; font-size:13px;">
    <div id="admin-pwd-error" style="display:none; color:#c00; font-size:11px; margin-top:8px;">Wrong password</div>
    <div style="display:flex; gap:8px; margin-top:16px;">
      <button onclick="closePwdModal()" style="flex:1; border:1px solid rgba(0,0,0,0.1); background:white; border-radius:9999px; padding:12px; cursor:pointer;">Cancel</button>
      <button onclick="checkAdminPwd()" style="flex:1; background:#2E5A3E; color:white; border:none; border-radius:9999px; padding:12px; cursor:pointer;">Enter</button>
    </div>
  </div>
</div>
<script>
function openAdminPortal(){ var p=document.getElementById('sfs-admin-portal'); if(p){ p.style.display='block'; window.scrollTo(0,0);} }
function closeAdminPortal(){ var p=document.getElementById('sfs-admin-portal'); if(p){ p.style.display='none';} }
function openPwdModal(){ var m=document.getElementById('admin-password-modal'); if(m){ m.style.display='flex'; document.getElementById('admin-pwd-input').value=''; document.getElementById('admin-pwd-input').focus(); } }
function closePwdModal(){ var m=document.getElementById('admin-password-modal'); if(m){ m.style.display='none';} }
function checkAdminPwd(){ var v=document.getElementById('admin-pwd-input').value; if(v==='sfsnepal2025'){ closePwdModal(); openAdminPortal(); } else { document.getElementById('admin-pwd-error').style.display='block'; } }
function updatePreview(){
  var name=document.getElementById('admin-name')?.value || 'Product name';
  var cap=document.getElementById('admin-caption')?.value || 'Caption...';
  var cat=document.getElementById('admin-category')?.value || 'dresses';
  document.getElementById('preview-title').textContent=name;
  document.getElementById('preview-caption').textContent=cap;
  var sizesDiv=document.getElementById('preview-sizes'); sizesDiv.innerHTML='';
  ['S','M','L','XL'].forEach(function(sz){ var cb=document.getElementById('size-'+sz); if(cb&&cb.checked){ var sp=document.createElement('span'); sp.textContent=sz; sp.style.cssText='border:1px solid rgba(0,0,0,0.1); border-radius:9999px; padding:4px 10px; font-size:11px;'; sizesDiv.appendChild(sp);} });
}
function handlePhotoPreview(input){
  if(input.files&&input.files[0]){
    var r=new FileReader();
    r.onload=function(e){
      var img=document.getElementById('admin-photo-preview-img');
      var pImg=document.getElementById('preview-img');
      if(img){ img.src=e.target.result; img.style.display='block'; }
      if(pImg){ pImg.innerHTML='<img src="'+e.target.result+'" style="width:100%; height:100%; object-fit:cover;">'; }
    };
    r.readAsDataURL(input.files[0]);
  }
}
(function(){
  function addFooterBtn(){
    var footer=document.querySelector('footer');
    if(!footer){ setTimeout(addFooterBtn,500); return; }
    if(document.getElementById('sfs-footer-admin-btn')) return;
    var wrap=document.createElement('div');
    wrap.style.cssText='width:100%; max-width:1280px; margin:0 auto; padding:16px 32px 0 32px; margin-top:24px; border-top:1px solid rgba(255,255,255,0.12); display:flex; justify-content:flex-end;';
    var btn=document.createElement('button');
    btn.id='sfs-footer-admin-btn';
    btn.textContent='Admin Portal';
    btn.style.cssText='background:rgba(255,255,255,0.12); color:white; border:1px solid rgba(255,255,255,0.18); border-radius:9999px; padding:8px 18px; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; cursor:pointer;';
    btn.onclick=openPwdModal;
    wrap.appendChild(btn);
    footer.appendChild(wrap);
  }
  document.addEventListener('DOMContentLoaded', addFooterBtn);
  setTimeout(addFooterBtn,800);
  setTimeout(addFooterBtn,2000);
})();
</script>

<style id="hide-qty-only">
/* Hide only white qty boxes with 1 - keep S M L XL checkboxes untouched */
#qty-S, #qty-M, #qty-L, #qty-XL,
input[id="qty-S"], input[id="qty-M"], input[id="qty-L"], input[id="qty-XL"] {
  display:none !important;
}
</style>
</body>
